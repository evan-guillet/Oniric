[package]
name = "oniric"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Logiciel libre de création de films"

[lib]
name = "oniric_lib"
crate-type = ["rlib"]

[[bin]]
name = "oniric"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# Without "app", the core (project, database, application data) builds and tests without Tauri.
app = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-specta",
  "dep:specta",
  "dep:specta-typescript",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:webview2-com",
  "dep:windows",
  "dep:windows-core",
]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [], optional = true }

[dependencies]
# SQLCipher from the start (architecture, D-11): an unencrypted project stays an ordinary SQLite database.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.4", features = [], optional = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
specta-typescript = { version = "0.0.12", optional = true }
tauri-plugin-dialog = { version = "2.8.3", optional = true }
tauri-plugin-opener = { version = "2.7.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }
webview2-com = { version = "0.39.1", optional = true }
windows = { version = "0.62.2", optional = true }
windows-core = { version = "0.62.2", optional = true }
